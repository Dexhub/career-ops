# config/standing-answers.yml — user-authored PREFERENCE answers for the
# autonomous apply worker (auto/apply-worker.mjs).
#
# HOW THIS FILE IS USED
#   Preference questions on application forms (salary, notice, start date,
#   relocation, "how did you hear") are filled VERBATIM from this file. Set
#   them as aggressively as you like — they are your stated preferences.
#
# WHAT THIS FILE IS NOT
#   Factual eligibility (visa/work authorization, citizenship, degrees,
#   certifications, criminal record) comes from config/profile.yml
#   (location.* and application_facts.*) and is NEVER overridden here.
#   The worker refuses to fabricate eligibility facts — hard constraint.
#
# PROVENANCE: `custom` below holds 127 answers ported verbatim from the old
# system's user-confirmed answer store (jobs/career-ops
# data/operator/answers.json, scope=global status=confirmed,
# provenance user-confirmed). Port authorized by the user on 2026-10-07
# ("you probably already have all standing answers from the old repo —
# pull/use here; don't keep anything manual").

filled_in_by_user: true

salary:
  # Used when the form wants one number (annual, USD).
  expectation_single_number_usd: 200000
  # Used when the form has a free-text salary field.
  expectation_text: "$200K base; $300K-$400K total compensation including equity and bonus"
  # Used when the form asks for a minimum.
  minimum_usd: 200000

availability:
  notice_period: "Two weeks"
  earliest_start_date: "Two weeks from offer acceptance"

location_preferences:
  willing_to_relocate: true
  remote_ok: true
  hybrid_ok: true
  onsite_ok: true

how_did_you_hear: "Company Website"

